<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 28">
  <!-- Ears (beige outer, red inner, dark tip) -->
  <ellipse cx="6" cy="6" rx="4.5" ry="5.5" fill="#F0D1B9"/>
  <ellipse cx="5.5" cy="5.5" rx="3.8" ry="4.8" fill="#8C2018"/>
  <ellipse cx="26" cy="6" rx="4.5" ry="5.5" fill="#F0D1B9"/>
  <ellipse cx="26.5" cy="5.5" rx="3.8" ry="4.8" fill="#8C2018"/>
  <!-- Head -->
  <ellipse cx="16" cy="16" rx="13.5" ry="11.5" fill="#8C2018"/>
  <!-- Face mask -->
  <ellipse cx="16" cy="18.5" rx="10" ry="8.5" fill="#F0D1B9"/>
  <!-- Forehead overlap -->
  <ellipse cx="16" cy="12" rx="8" ry="5" fill="#8C2018"/>
  <!-- Eye marks -->
  <ellipse cx="11.5" cy="14.5" rx="2.5" ry="2" fill="#2A1610" transform="rotate(-8, 11.5, 14.5)"/>
  <ellipse cx="20.5" cy="14.5" rx="2.5" ry="2" fill="#2A1610" transform="rotate(8, 20.5, 14.5)"/>
  <!-- Eyes -->
  <circle cx="11.5" cy="14.5" r="1.3" fill="#1A0E08"/>
  <circle cx="20.5" cy="14.5" r="1.3" fill="#1A0E08"/>
  <!-- Nose -->
  <ellipse cx="16" cy="19.5" rx="2.2" ry="1.6" fill="#2A1610"/>
</svg>
